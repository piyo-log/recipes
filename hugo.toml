baseURL = 'https://piyo-log.github.io/recipes/'
languageCode = 'ja'
defaultContentLanguage = 'ja'
hasCJKLanguage = true
title = 'ピヨのごはんログ'
enableRobotsTXT = true
timeZone = 'Asia/Tokyo'
disableKinds = ['taxonomy', 'term']

[params]
  description = '子どもの晩ごはんの調理記録とレシピ。作った料理、食べた様子、次に変えたいことを残しています。'

[permalinks]
  posts = '/posts/:slug/'

[markup.goldmark.renderer]
  unsafe = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[outputs]
  home = ['HTML', 'RSS']
