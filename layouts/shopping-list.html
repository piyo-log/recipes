{{ define "main" }}
<article class="article shell shopping-page">
  <a class="back-link" href="{{ "recipes/" | relURL }}"><span aria-hidden="true">←</span> レシピ一覧</a>
  <header class="article-header">
    <h1>{{ .Title }}</h1><p class="article-description">{{ .Description }}</p>
  </header>
  <div class="article-layout">
    <div class="prose">{{ .Content }}</div>
    <aside class="toc"><p class="section-label">買い物リストの内容</p>{{ .TableOfContents }}</aside>
  </div>
  <div class="article-end"><a class="text-link" href="{{ "recipes/" | relURL }}"><span aria-hidden="true">←</span> レシピ一覧へ</a><span>{{ site.Title }}</span></div>
</article>
{{ end }}
