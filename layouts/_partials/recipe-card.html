<li>
  <a class="recipe-row" href="{{ .RelPermalink }}" aria-labelledby="recipe-{{ .File.ContentBaseName }}" aria-describedby="recipe-meta-{{ .File.ContentBaseName }}{{ with .Params.batch }} recipe-batch-{{ $.File.ContentBaseName }}{{ end }}">
    <span class="recipe-row-main">
      <span class="recipe-row-title" id="recipe-{{ .File.ContentBaseName }}">{{ .Title }}</span>
      {{ with .Params.batch }}<span class="recipe-row-batch" id="recipe-batch-{{ $.File.ContentBaseName }}">{{ . }}</span>{{ end }}
    </span>
    <span class="recipe-row-meta" id="recipe-meta-{{ .File.ContentBaseName }}">
      {{ with .Params.duration }}<span class="recipe-row-time">{{ . }}</span>{{ end }}
      {{ with .Params.status }}<span class="status">{{ . }}</span>{{ end }}
    </span>
  </a>
</li>
