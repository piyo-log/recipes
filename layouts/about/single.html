{{ define "main" }}
<article class="article shell about-page">
  <a class="back-link" href="{{ .CurrentSection.RelPermalink }}"><span aria-hidden="true">←</span> このログについて・紹介の履歴</a>
  <header class="article-header">
    <p class="eyebrow">ABOUT THIS LOG</p>
    <h1>{{ .Title }}</h1>
    <p class="article-description">{{ .Description }}</p>
  </header>
  <div class="about-snapshot-note">
    <p><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年1月2日" }}</time>時点の紹介です。年齢や暮らし、食事の方針は、この時点のものとして残しています。</p>
    <a class="text-link" href="{{ .CurrentSection.RelPermalink }}">最新の紹介と履歴を見る <span aria-hidden="true">→</span></a>
  </div>
  <div class="prose">{{ .Content }}</div>
  <div class="article-end"><a class="text-link" href="{{ .CurrentSection.RelPermalink }}"><span aria-hidden="true">←</span> このログについて</a><span>{{ site.Title }}</span></div>
</article>
{{ end }}
