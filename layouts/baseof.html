<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="theme-color" content="#faf8f0">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title | default site.Title }}">
  <meta property="og:description" content="{{ .Description | default site.Params.description }}">
  <meta property="og:type" content="{{ if and .IsPage (in (slice "posts" "recipes") .Section) }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="{{ site.Title }}">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ "index.xml" | relURL }}">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header shell">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} ホーム">
      {{ partial "chick.html" . }}
      <span>{{ site.Title }}</span>
    </a>
    <nav aria-label="メインメニュー">
      <a href="{{ "posts/" | relURL }}" {{ if eq .Section "posts" }}aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>ごはんの記録</a>
      <a href="{{ "recipes/" | relURL }}" {{ if or (eq .Section "recipes") (eq .Layout "shopping-list") }}aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>レシピ</a>
      <a href="{{ "about/" | relURL }}" {{ if eq .Section "about" }}aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>このログについて</a>
    </nav>
  </header>
  <main id="main">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer shell">
    <div><span class="footer-brand">{{ site.Title }}</span><p>少しずつ食べて、少しずつ続ける。</p></div>
    <div class="footer-links"><a href="{{ "about/" | relURL }}">このログについて</a><a href="{{ "index.xml" | relURL }}">RSS <span aria-hidden="true">↗</span></a></div>
    <small>© {{ now.Year }} {{ site.Title }}</small>
  </footer>
</body>
</html>
